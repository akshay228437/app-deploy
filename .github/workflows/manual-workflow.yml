name: manual workflow
on:
        workflow_dispatch: 
                inputs:
                        environment:
                                description: "Environment to deploy to"
                                required: false
                                default: "dev"
                                type: string
                        version:
                                description: "version to deploy"
                                required: true
                                type: string
jobs:
        manual-run:
                runs-on: ubuntu-latest

                steps:
                        - name: Print inputs
                          run: |
                                  echo "Environment: ${{ inputs.environment }}"
                                  echo "Version: ${{ inputs.version }}"


